services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robot_factor
      POSTGRES_USER: robot_factor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot_factor -d robot_factor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://robot_factor:${POSTGRES_PASSWORD}@db:5432/robot_factor
      INVOICE_STORAGE_DIR: /app/data/invoices
    volumes:
      - invoice_files:/app/data/invoices
      - ./branding:/app/branding:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  invoice_files:

