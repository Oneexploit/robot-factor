[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robot-factor"
version = "0.1.0"
description = "Multi-channel Persian invoice bot for Telegram and Rubika"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jdatetime>=5.2,<6",
  "jinja2>=3.1,<4",
  "playwright>=1.54,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
robot-factor = "robot_factor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_factor"]

[tool.hatch.build.targets.wheel.force-include]
"src/robot_factor/templates" = "robot_factor/templates"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
  "ASYNC109", # Telegram's API itself calls the long-poll value `timeout`.
  "B008",
  "RUF001",   # Persian/Arabic Unicode is intentional in this application.
]
